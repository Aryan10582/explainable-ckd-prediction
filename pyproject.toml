[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ckd-xai"
version = "1.0.0"
description = "Explainable machine learning for chronic kidney disease prediction with SHAP (undergraduate mini-project)"
requires-python = ">=3.11"
authors = [{ name = "Vedank Singh" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
